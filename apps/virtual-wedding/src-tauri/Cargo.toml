[package]
name = "virtual-wedding-live"
version = "1.0.0"
description = "Virtual Wedding Live desktop app"
authors = ["Virtual Wedding Live"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
uuid = { version = "1", features = ["v4"] }
