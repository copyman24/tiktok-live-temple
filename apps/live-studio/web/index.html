<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17120f">
  <title>TikTok Live Studio</title>
  <link rel="stylesheet" href="/studio/fonts/fonts.css">
  <link rel="stylesheet" href="/studio/studio.css">
</head>
<body>
  <header class="studio-top">
    <div class="studio-brand">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><rect x="3" y="5" width="11" height="22" rx="2.5"/><rect x="18" y="5" width="11" height="22" rx="2.5"/></svg></span>
      <span><b>TikTok Live Studio</b><small>Hai phiên live trong một ứng dụng</small></span>
    </div>
    <div class="obs-box">
      <span class="obs-label">Nguồn OBS chung</span>
      <code id="obs-url">http://127.0.0.1:3200/obs</code>
      <button type="button" id="copy-obs" class="ghost-button">Sao chép</button>
    </div>
  </header>

  <main class="studio-main">
    <section class="studio-intro">
      <p class="eyebrow">CHỌN PHIÊN</p>
      <h1>Hôm nay bạn phát phiên nào?</h1>
      <p class="intro-copy">Mỗi phiên giữ nguyên dữ liệu khi bạn chuyển qua lại. Nguồn OBS ở trên tự đổi theo phiên đang mở, không cần sửa cảnh.</p>
      <label class="carry-toggle"><input type="checkbox" id="carry-live" checked><span>Giữ phòng TikTok đang kết nối khi đổi phiên</span></label>
      <p class="last-room" id="last-room" hidden></p>
    </section>

    <section class="session-grid" id="session-grid" aria-label="Các phiên live" aria-busy="true"></section>
    <p class="studio-notice" id="studio-notice" role="status" aria-live="polite"></p>
  </main>

  <template id="session-card">
    <article class="session-card">
      <div class="session-art"><img alt="" loading="eager"></div>
      <div class="session-body">
        <p class="session-kicker"></p>
        <h2 class="session-title"></h2>
        <p class="session-desc"></p>
        <ul class="session-lines"></ul>
        <div class="session-status"><span class="status-dot" aria-hidden="true"></span><span class="status-text"></span></div>
        <div class="session-actions">
          <button type="button" class="primary-button"></button>
          <a class="ghost-button stage-link" target="_blank" rel="noreferrer">Xem sân khấu</a>
        </div>
      </div>
    </article>
  </template>
  <script src="/studio/studio.js" type="module"></script>
</body>
</html>
